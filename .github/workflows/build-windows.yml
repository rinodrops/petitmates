name: Build Windows and create draft release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkout ConfUI
        uses: actions/checkout@v4
        with:
          repository: rinodrops/confui
          ref: v0.1.0
          path: confui

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 imagemagick

      # ConfUI Makefile uses `magick` (ImageMagick 7); Ubuntu ships IM6 as `convert`.
      - name: Ensure ImageMagick magick command
        run: |
          if ! command -v magick >/dev/null; then
            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          fi

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-win-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-win-

      - name: Build Windows package
        run: make win CONFUI_DIR=confui

      - name: Package Windows zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="Petit-Mates-v${VERSION}-windows-x86_64.zip"
          cd dist/petitmates-windows
          zip "../../${ZIP}" "Petit Mates.exe" "Settings.exe"
          echo "WIN_ZIP=${ZIP}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: petitmates-windows
          path: ${{ env.WIN_ZIP }}

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          {
            echo "## Petit Mates ${VERSION}"
            echo ""
            awk -v ver="### ${VERSION}" '
              $0 == ver { capture=1; print; next }
              capture && /^### v[0-9]/ { exit }
              capture { print }
            ' README.md
            echo ""
            echo "### macOS Installation"
            echo "1. Download the DMG and open it."
            echo "2. Drag **Petit Mates.app** to your Applications folder."
            echo "3. Launch — a menu bar icon appears."
            echo ""
            echo "### Windows Installation"
            echo "1. Download the zip and extract it."
            echo "2. Run **Petit Mates.exe** — a system tray icon appears."
          } > release-body.md

      - name: Create draft release and attach Windows zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ env.WIN_ZIP }}
          body_path: release-body.md
