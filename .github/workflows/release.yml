name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      APPLE_DEVELOPER_CERTIFICATE_NAME: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_NAME }}
      APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_DEVELOPER_APP_PASSWORD: ${{ secrets.APPLE_DEVELOPER_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Settings
        uses: actions/checkout@v4
        with:
          repository: rinodrops/settings
          ref: v0.2.5
          path: settings

      - uses: extractions/setup-just@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dmgbuild
        run: pip install dmgbuild

      - name: Import code signing certificate
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_DEVELOPER_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_DEVELOPER_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-${{ matrix.arch }}-

      - name: Sanitize notarization credentials
        # GitHub Secrets pasted from a terminal often include a trailing newline,
        # which makes notarytool return HTTP 401 (Invalid credentials).
        run: |
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          echo "APPLE_ID=$(trim "$APPLE_ID")" >> "$GITHUB_ENV"
          echo "APPLE_DEVELOPER_TEAM_ID=$(trim "$APPLE_DEVELOPER_TEAM_ID")" >> "$GITHUB_ENV"
          echo "APPLE_DEVELOPER_APP_PASSWORD=$(trim "$APPLE_DEVELOPER_APP_PASSWORD")" >> "$GITHUB_ENV"

      - name: Validate notarization credentials
        run: |
          test -n "$APPLE_ID" || { echo "APPLE_ID is empty" >&2; exit 1; }
          test "${#APPLE_DEVELOPER_TEAM_ID}" -eq 10 || \
            { echo "APPLE_DEVELOPER_TEAM_ID must be 10 characters (got ${#APPLE_DEVELOPER_TEAM_ID})" >&2; exit 1; }
          test "${#APPLE_DEVELOPER_APP_PASSWORD}" -eq 19 || \
            { echo "APPLE_DEVELOPER_APP_PASSWORD must be 19 characters (got ${#APPLE_DEVELOPER_APP_PASSWORD}); use an app-specific password from appleid.apple.com" >&2; exit 1; }

      - name: Build and notarize (${{ matrix.arch }})
        run: just darwin-notarize-${{ matrix.arch }}
        env:
          SETTINGS_DIR: settings

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Petit-Mates-v*-darwin-${{ matrix.arch }}.dmg

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Settings
        uses: actions/checkout@v4
        with:
          repository: rinodrops/settings
          ref: v0.2.5
          path: settings

      - uses: extractions/setup-just@v2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 imagemagick

      - name: Ensure magick command
        run: |
          if ! command -v magick >/dev/null; then
            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Build Windows package
        run: just win-zip
        env:
          SETTINGS_DIR: settings

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Petit-Mates-v*-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          {
            echo "## Petit Mates ${VERSION}"
            echo ""
            awk -v ver="### ${VERSION}" '
              $0 == ver { capture=1; print; next }
              capture && /^### v[0-9]/ { exit }
              capture { print }
            ' README.md
            echo ""
            echo "### macOS Installation"
            echo "1. Download the DMG for your Mac (Apple Silicon or Intel) and open it."
            echo "2. Drag **Petit Mates.app** to your Applications folder."
            echo "3. Launch — a menu bar icon appears."
            echo ""
            echo "### Windows Installation"
            echo "1. Download the zip and extract it."
            echo "2. Run **Petit Mates.exe** — a system tray icon appears."
          } > release-body.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-body.md
          files: artifacts/**/*
