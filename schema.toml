# Petit Mates — Settings schema for user.toml
# Build: make -C ../settings SCHEMA=/path/to/this/file binary

icon_style = "rounded"
theme      = "os"
lang       = "os"
lang_key   = "display.language"
save_button = "os"

schema_version = 1

# ── Display ──────────────────────────────────────────────────────────────────

[[tabs]]
id    = "display"
label = { en = "Display", ja = "表示" }
icon  = "monitor"

[[tabs.fields]]
key    = "display.sprite_size"
label  = { en = "Character size", ja = "キャラクターサイズ" }
type   = "number"
widget = "slider"
min    = 80
max    = 300
step   = 10
suffix = " px"

[[tabs.fields]]
key       = "display.font_size"
label     = { en = "Speech font size", ja = "吹き出しの文字サイズ" }
type      = "number"
widget    = "drag_value"
min       = 8
max       = 32
step      = 1
suffix    = " pt"
max_width = 120

[[tabs.fields]]
key       = "display.tick_rate_ac"
label     = { en = "Frame rate (AC)", ja = "フレームレート (AC電源)" }
sublabel  = { en = "fps", ja = "fps" }
type      = "number"
widget    = "segmented_control"
options   = ["10", "15", "30", "60"]
max_width = 280

[[tabs.fields]]
key       = "display.tick_rate_battery"
label     = { en = "Frame rate (battery)", ja = "フレームレート (バッテリ)" }
sublabel  = { en = "fps", ja = "fps" }
type      = "number"
widget    = "segmented_control"
options   = ["10", "15", "30", "60"]
max_width = 280

[[tabs.fields]]
key       = "display.language"
label     = { en = "Speech language", ja = "吹き出しの言語" }
type      = "string"
widget    = "segmented_control"
options   = ["os", "en", "ja"]
max_width = 280

# ── Characters ───────────────────────────────────────────────────────────────

[[constraints]]
id   = "chars_min_one"
expr = "characters.bearded_dragon + characters.pond_turtle + characters.leopard_gecko >= 1"

[[tabs]]
id    = "characters"
label = { en = "Characters", ja = "キャラクター" }
icon  = "egg"

[[tabs.fields]]
key       = "characters.bearded_dragon"
label     = { en = "Bearded Dragon", ja = "フトアゴヒゲトカゲ" }
type      = "number"
widget    = "segmented_control"
options   = ["0", "1", "2", "3", "4", "5"]

[[tabs.fields.option_states]]
value = "0"
when  = "chars_min_one"

[[tabs.fields]]
key       = "characters.pond_turtle"
label     = { en = "Pond Turtle", ja = "クサガメ" }
type      = "number"
widget    = "segmented_control"
options   = ["0", "1", "2", "3", "4", "5"]

[[tabs.fields.option_states]]
value = "0"
when  = "chars_min_one"

[[tabs.fields]]
key       = "characters.leopard_gecko"
label     = { en = "Leopard Gecko", ja = "レオパードゲッコー" }
type      = "number"
widget    = "segmented_control"
options   = ["0", "1", "2", "3", "4", "5"]
hint      = { en = "At least one species count must be greater than zero.", ja = "少なくとも1種類のキャラクター数を0より大きくしてください。" }

[[tabs.fields.option_states]]
value = "0"
when  = "chars_min_one"

# ── Pets ─────────────────────────────────────────────────────────────────────

[[tabs]]
id    = "pets"
label = { en = "Pets", ja = "個体" }
icon  = "pets"
content_height = 540

[[tabs.fields]]
widget = "separator"
label  = { en = "Appearance order", ja = "登場順" }

[[tabs.fields]]
key              = "pets.bearded_dragon"
label            = { en = "Bearded dragons", ja = "フトアゴヒゲトカゲ" }
widget           = "record_list"
record_title_key = "name"
record_id_key    = "id"
on_change        = "pet_preview"

[[tabs.fields.item_fields]]
key    = "name"
label  = { en = "Name", ja = "名前" }
widget = "text_input"

[[tabs.fields.item_fields]]
key            = "body_color"
label          = { en = "Body color", ja = "体の色" }
widget         = "color_palette"
legacy_hue_key = "hue"
colors         = [
    { id = "original", label = { en = "Original", ja = "原画" }, hsv = [38, 74, 96] },
    { id = "red_clay", label = { en = "Red clay", ja = "赤土" }, hsv = [18, 67, 73] },
    { id = "apricot", label = { en = "Apricot", ja = "杏" }, hsv = [23, 51, 94] },
    { id = "persimmon", label = { en = "Persimmon", ja = "柿" }, hsv = [28, 79, 87] },
    { id = "amber", label = { en = "Amber", ja = "琥珀" }, hsv = [34, 73, 88] },
    { id = "honey", label = { en = "Honey", ja = "はちみつ" }, hsv = [42, 72, 98] },
    { id = "wheat", label = { en = "Wheat", ja = "小麦" }, hsv = [45, 48, 83] },
    { id = "sand", label = { en = "Sand", ja = "サンド" }, hsv = [49, 36, 92] },
    { id = "straw", label = { en = "Straw", ja = "麦わら" }, hsv = [54, 58, 88] },
    { id = "ochre", label = { en = "Muted ochre", ja = "淡い黄土" }, hsv = [58, 48, 73] },
]

[[tabs.fields]]
key              = "pets.pond_turtle"
label            = { en = "Pond turtles", ja = "クサガメ" }
widget           = "record_list"
record_title_key = "name"
record_id_key    = "id"
on_change        = "pet_preview"

[[tabs.fields.item_fields]]
key    = "name"
label  = { en = "Name", ja = "名前" }
widget = "text_input"

[[tabs.fields.item_fields]]
key            = "shell_color"
label          = { en = "Shell color", ja = "背甲の色" }
widget         = "color_palette"
legacy_hue_key = "shell_hue"
colors         = [
    { id = "original", label = { en = "Original", ja = "原画" }, hsv = [42, 48, 42] },
    { id = "chestnut", label = { en = "Chestnut", ja = "栗" }, hsv = [22, 63, 48] },
    { id = "dark_brown", label = { en = "Dark brown", ja = "濃茶" }, hsv = [26, 57, 29] },
    { id = "walnut", label = { en = "Walnut", ja = "くるみ" }, hsv = [31, 56, 53] },
    { id = "ochre", label = { en = "Ochre", ja = "黄土" }, hsv = [36, 58, 65] },
    { id = "amber_brown", label = { en = "Amber brown", ja = "琥珀茶" }, hsv = [45, 66, 55] },
    { id = "dry_grass", label = { en = "Dry grass", ja = "枯れ草" }, hsv = [49, 37, 63] },
    { id = "olive_brown", label = { en = "Olive brown", ja = "オリーブ茶" }, hsv = [54, 48, 46] },
    { id = "moss_brown", label = { en = "Moss brown", ja = "苔茶" }, hsv = [58, 43, 35] },
    { id = "deep_olive", label = { en = "Deep olive", ja = "深いオリーブ" }, hsv = [62, 52, 34] },
