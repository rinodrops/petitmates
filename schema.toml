[[tabs.fields.item_fields]]
key            = "skin_color"
label          = { en = "Skin color", ja = "肌の色" }
widget         = "color_palette"
legacy_hue_key = "skin_hue"
colors         = [
    { id = "original", label = { en = "Original", ja = "原画" }, hsv = [46, 58, 52] },
    { id = "russet_sand", label = { en = "Russet sand", ja = "赤みの砂" }, hsv = [26, 35, 66] },
    { id = "beige", label = { en = "Beige", ja = "ベージュ" }, hsv = [32, 34, 74] },
    { id = "camel", label = { en = "Camel", ja = "キャメル" }, hsv = [37, 58, 68] },
    { id = "gold_brown", label = { en = "Golden brown", ja = "金茶" }, hsv = [42, 66, 59] },
    { id = "mustard", label = { en = "Mustard", ja = "からし" }, hsv = [50, 68, 66] },
    { id = "dry_grass", label = { en = "Dry grass", ja = "枯れ草" }, hsv = [54, 37, 73] },
    { id = "olive", label = { en = "Olive", ja = "オリーブ" }, hsv = [58, 52, 56] },
    { id = "pale_olive", label = { en = "Pale olive", ja = "淡いオリーブ" }, hsv = [63, 37, 64] },
    { id = "deep_olive", label = { en = "Deep olive", ja = "深いオリーブ" }, hsv = [66, 48, 41] },
]

[[tabs.fields]]
key              = "pets.leopard_gecko"
label            = { en = "Leopard geckos", ja = "レオパードゲッコー" }
widget           = "record_list"
record_title_key = "name"
record_id_key    = "id"
on_change        = "pet_preview"

[[tabs.fields.item_fields]]
key    = "name"
label  = { en = "Name", ja = "名前" }
widget = "text_input"

# ── Speech ───────────────────────────────────────────────────────────────────

[[tabs]]
id    = "speech"
label = { en = "Speech", ja = "発話" }
icon  = "chat"

[[tabs.fields]]
key    = "speech.enabled"
label  = { en = "Enable speech", ja = "発話を有効にする" }
type   = "bool"
widget = "toggle"

[[tabs.fields]]
key    = "speech.speech_lock_sec"
label  = { en = "Minimum interval between speeches", ja = "発話の最小間隔" }
type   = "number"
widget = "slider"
min    = 5
max    = 120
step   = 5
suffix = " s"

# ── Weather ──────────────────────────────────────────────────────────────────

[[tabs]]
id    = "weather"
label = { en = "Weather", ja = "天気" }
icon  = "cloud"

[[tabs.fields]]
key    = "weather.enabled"
label  = { en = "Enable weather", ja = "天気を有効にする" }
type   = "bool"
widget = "toggle"

[[tabs.fields]]
key    = "weather.city"
label  = { en = "City", ja = "都市" }
type   = "string"
widget = "text_input"
hint   = { en = "Used for weather reactions. Leave empty to disable location lookup.", ja = "天気反応に使用します。空欄の場合は位置情報を取得しません。" }
