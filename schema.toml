# Petit Mates — Settings schema for user.toml
# Build: make -C ../settings SCHEMA=/path/to/this/file binary

icon_style = "rounded"
theme      = "os"
lang       = "os"
lang_key   = "display.language"
save_button = "os"

schema_version = 1

[[migration]]
version = 1
  [[migration.transform]]
  from  = "mode"
  to    = "vivarium.enabled"
  type  = "enum_to_bool"
  match = "vivarium"

# ── Display ──────────────────────────────────────────────────────────────────

[[tabs]]
id    = "display"
label = { en = "Display", ja = "表示" }
icon  = "monitor"

[[tabs.fields]]
key    = "display.sprite_size"
label  = { en = "Character size", ja = "キャラクターサイズ" }
type   = "number"
widget = "slider"
min    = 80
max    = 300
step   = 10
suffix = " px"

[[tabs.fields]]
key       = "display.font_size"
label     = { en = "Speech font size", ja = "吹き出しの文字サイズ" }
type      = "number"
widget    = "drag_value"
min       = 8
max       = 32
step      = 1
suffix    = " pt"
max_width = 120

[[tabs.fields]]
key       = "display.tick_rate_ac"
label     = { en = "Frame rate (AC)", ja = "フレームレート (AC電源)" }
sublabel  = { en = "fps", ja = "fps" }
type      = "number"
widget    = "segmented_control"
options   = ["10", "15", "30", "60"]
max_width = 280

[[tabs.fields]]
key       = "display.tick_rate_battery"
label     = { en = "Frame rate (battery)", ja = "フレームレート (バッテリ)" }
sublabel  = { en = "fps", ja = "fps" }
type      = "number"
widget    = "segmented_control"
options   = ["10", "15", "30", "60"]
max_width = 280

[[tabs.fields]]
key       = "display.language"
label     = { en = "Speech language", ja = "吹き出しの言語" }
type      = "string"
widget    = "segmented_control"
options   = ["os", "en", "ja"]
max_width = 280

# ── Characters ───────────────────────────────────────────────────────────────

[[constraints]]
id   = "chars_min_one"
expr = "characters.bearded_dragon + characters.pond_turtle + characters.leopard_gecko >= 1"

[[tabs]]
id    = "characters"
label = { en = "Characters", ja = "キャラクター" }
icon  = "egg"

[[tabs.fields]]
key       = "characters.bearded_dragon"
label     = { en = "Bearded Dragon", ja = "フトアゴヒゲトカゲ" }
type      = "number"
widget    = "segmented_control"
options   = ["0", "1", "2", "3", "4", "5"]

[[tabs.fields.option_states]]
value = "0"
when  = "chars_min_one"

[[tabs.fields]]
key       = "characters.pond_turtle"
label     = { en = "Pond Turtle", ja = "クサガメ" }
type      = "number"
widget    = "segmented_control"
options   = ["0", "1", "2", "3", "4", "5"]

[[tabs.fields.option_states]]
value = "0"
when  = "chars_min_one"

[[tabs.fields]]
key       = "characters.leopard_gecko"
label     = { en = "Leopard Gecko", ja = "レオパードゲッコー" }
type      = "number"
widget    = "segmented_control"
options   = ["0", "1", "2", "3", "4", "5"]
hint      = { en = "At least one species count must be greater than zero.", ja = "少なくとも1種類のキャラクター数を0より大きくしてください。" }

[[tabs.fields.option_states]]
value = "0"
when  = "chars_min_one"

# ── Speech ───────────────────────────────────────────────────────────────────

[[tabs]]
id    = "speech"
label = { en = "Speech", ja = "発話" }
icon  = "chat"

[[tabs.fields]]
key    = "speech.enabled"
label  = { en = "Enable speech", ja = "発話を有効にする" }
type   = "bool"
widget = "toggle"

[[tabs.fields]]
key    = "speech.speech_lock_sec"
label  = { en = "Minimum interval between speeches", ja = "発話の最小間隔" }
type   = "number"
widget = "slider"
min    = 5
max    = 120
step   = 5
suffix = " s"

# ── Weather ──────────────────────────────────────────────────────────────────

[[tabs]]
id    = "weather"
label = { en = "Weather", ja = "天気" }
icon  = "cloud"

[[tabs.fields]]
key    = "weather.enabled"
label  = { en = "Enable weather", ja = "天気を有効にする" }
type   = "bool"
widget = "toggle"

[[tabs.fields]]
key    = "weather.city"
label  = { en = "City", ja = "都市" }
type   = "string"
widget = "text_input"
hint   = { en = "Used for weather reactions. Leave empty to disable location lookup.", ja = "天気反応に使用します。空欄の場合は位置情報を取得しません。" }

# ── Vivarium ─────────────────────────────────────────────────────────────────

[[tabs]]
id    = "vivarium"
label = { en = "Vivarium", ja = "水槽" }
icon  = "home"

[[tabs.fields]]
key    = "vivarium.enabled"
label  = { en = "Show glass cage", ja = "水槽を表示する" }
type   = "bool"
widget = "toggle"

[[tabs.fields]]
key       = "vivarium.z_order"
label     = { en = "Z-order", ja = "重ね順" }
type      = "string"
widget    = "segmented_control"
options   = ["desktop", "normal", "front"]
max_width = 280
hint      = { en = "desktop = behind windows, normal = with windows, front = always on top.", ja = "desktop = ウィンドウの後ろ、normal = 通常、front = 最前面。" }

[[tabs.fields]]
key    = "vivarium.display_scale"
label  = { en = "Display scale", ja = "表示スケール" }
type   = "number"
widget = "slider"
min    = 0.25
max    = 2.0
step   = 0.05

[[tabs.fields]]
key       = "vivarium.logical_w"
label     = { en = "Cage width", ja = "水槽の幅" }
type      = "number"
widget    = "drag_value"
min       = 320
max       = 1920
step      = 16
suffix    = " px"
max_width = 120

[[tabs.fields]]
key       = "vivarium.logical_h"
label     = { en = "Cage height", ja = "水槽の高さ" }
type      = "number"
widget    = "drag_value"
min       = 240
max       = 1280
step      = 16
suffix    = " px"
max_width = 120
hint      = { en = "Snaps to 16 px. Move the cage with ⌘-drag (Ctrl-drag on Windows); resize from an edge with ⌥⌘-drag (Alt+Ctrl-drag).", ja = "16 px 単位にスナップします。移動は ⌘-ドラッグ（Windows は Ctrl-ドラッグ）、端からのリサイズは ⌥⌘-ドラッグ（Windows は Alt+Ctrl-ドラッグ）です。" }
